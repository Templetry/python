schema_version: 1
name: python-fastapi-service
description: FastAPI service — src layout, pytest with TestClient, optional Dockerfile
kinds: [backend]
languages: [python]
frameworks: [fastapi]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: python_version
    label: Python version
    type: select
    options: ["3.12", "3.13"]
    default: "3.13"

identity:
  - from: "template_app"           # package dir under src/
    to: "{project_name.snake}"
  - from: "template-app"           # pyproject name, docker tag
    to: "{project_name.kebab}"
  - from: "TemplateApp"            # docstrings, OpenAPI title
    to: "{project_name.pascal}"

features:
  - key: docker
    label: Dockerfile (python slim + uvicorn)
    default: true
    files: ["Dockerfile", ".dockerignore"]

verify:
  image: python:3.13-slim
  run: pip install -e .[dev] && pytest
