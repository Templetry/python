name: Verify forms

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forms:
    name: ${{ matrix.form }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form: [fastapi-service, cli-typer, fastapi-users]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install templetry
        run: |
          curl -fsSL -o /usr/local/bin/templetry \
            "https://github.com/Templetry/engine/releases/download/v1.7.0/templetry-linux-amd64"
          chmod +x /usr/local/bin/templetry
      - name: Render
        run: |
          templetry render --template "./${{ matrix.form }}" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "python_version=${{ matrix.python }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          pip install -e .[dev]
          pytest

  piece:
    name: fastapi-users + ${{ matrix.case.piece }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { piece: crud-resource, args: "--set entity=Product" }
          - { piece: rbac, args: "--set admin_role=admin" }
    steps:
      - uses: actions/checkout@v4
      - name: Install templetry
        run: |
          curl -fsSL -o /usr/local/bin/templetry \
            "https://github.com/Templetry/engine/releases/download/v1.7.0/templetry-linux-amd64"
          chmod +x /usr/local/bin/templetry
      - name: Render and adopt the piece
        run: |
          templetry render --template ./fastapi-users --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App"
          templetry add "${{ matrix.case.piece }}" "$RUNNER_TEMP/out" \
            --template ./fastapi-users ${{ matrix.case.args }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test augmented output
        working-directory: ${{ runner.temp }}/out
        run: |
          pip install -e .[dev]
          pytest
