schema_version: 1
name: python-cli-typer
description: Python CLI — Typer commands, src layout, pytest with CliRunner
platform: cli
framework: typer

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: python_version
    label: Python version
    type: select
    options: ["3.12", "3.13"]
    default: "3.13"

identity:
  - from: "template_app"           # package dir under src/
    to: "{project_name.snake}"
  - from: "template-app"           # pyproject name, console script
    to: "{project_name.kebab}"
  - from: "TemplateApp"            # docstrings, help text
    to: "{project_name.pascal}"

verify:
  image: python:3.13-slim
  run: pip install -e .[dev] && pytest
