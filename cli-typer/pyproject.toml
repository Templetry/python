[project]
name = "template-app"
version = "0.1.0"
description = "TemplateApp - command line tool"
requires-python = ">=3.12"  # tpl:var python_version 3.12
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
template-app = "template_app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
