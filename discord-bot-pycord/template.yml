schema_version: 1
name: python-discord-bot-pycord
description: Discord bot — py-cord, auto-loading cogs, per-guild settings storage, pytest
kinds: [backend]
languages: [python]
frameworks: [pycord]

variables:
  - key: project_name
    label: Bot name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: python_version
    label: Python version
    type: select
    options: ["3.12", "3.13"]
    default: "3.13"
  - key: bot_prefix
    label: Text command prefix (slash commands always work regardless)
    type: string
    default: "!"

identity:
  - from: "template_bot"           # package dir under src/
    to: "{project_name.snake}"
  - from: "template-bot"           # pyproject name, console script
    to: "{project_name.kebab}"
  - from: "TemplateBot"            # log lines, README title
    to: "{project_name.pascal}"

# Base (always present, no matter which features are on): bot bootstrap with
# auto-discovered cog loading, logging, a global error handler, and a small
# per-guild JSON store — the plumbing every Discord bot needs regardless of
# what it's actually for. Everything below is a capability built on top of it.
features:
  - key: settings
    label: "/settings admin commands backed by per-guild storage (welcome channel, auto-role, mod-log channel)"
    default: true
    files: ["src/template_bot/cogs/settings.py"]

  - key: admin
    label: Owner-only maintenance commands (sync, reload, shutdown)
    default: true
    files: ["src/template_bot/cogs/admin.py"]

  - key: moderation
    label: Moderation commands (kick, ban, purge), optionally logged to a mod-log channel
    default: true
    files: ["src/template_bot/cogs/moderation.py"]

  - key: welcome
    label: Welcome message + auto-role on member join, configured via /settings
    default: true
    requires: [settings]
    files: ["src/template_bot/cogs/welcome.py"]

  - key: custom_commands
    label: Let server admins define simple text-response commands at runtime
    default: true
    files: ["src/template_bot/cogs/custom_commands.py"]

  - key: music
    label: Voice channel music playback (yt-dlp + ffmpeg required on the host)
    default: false
    files: ["src/template_bot/cogs/music.py"]
    patches:
      - file: pyproject.toml
        op: add
        path: /project/dependencies/-
        value: "yt-dlp>=2024.8.6"
      - file: pyproject.toml
        op: add
        path: /project/dependencies/-
        value: "PyNaCl>=1.5"

presets:
  - key: minimal
    label: Bare bot — only ping/uptime, no admin tooling or capability cogs
    features: {settings: false, admin: false, moderation: false, welcome: false, custom_commands: false, music: false}
  - key: full
    label: Everything, including music
    features: {settings: true, admin: true, moderation: true, welcome: true, custom_commands: true, music: true}

verify:
  image: python:3.13-slim
  run: pip install -e .[dev] && pytest
