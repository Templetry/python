schema_version: 1
name: python-discord-bot-pycord
description: Discord bot — py-cord, cogs for moderation/welcome/music, pytest
kinds: [backend]
languages: [python]
frameworks: [pycord]

variables:
  - key: project_name
    label: Bot name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: python_version
    label: Python version
    type: select
    options: ["3.12", "3.13"]
    default: "3.13"
  - key: bot_prefix
    label: Text command prefix (slash commands always work regardless)
    type: string
    default: "!"

identity:
  - from: "template_bot"           # package dir under src/
    to: "{project_name.snake}"
  - from: "template-bot"           # pyproject name, console script
    to: "{project_name.kebab}"
  - from: "TemplateBot"            # log lines, README title
    to: "{project_name.pascal}"

features:
  - key: moderation
    label: Moderation commands (kick, ban, purge)
    default: true
    files: ["src/template_bot/cogs/moderation.py"]

  - key: welcome
    label: Welcome message + auto-role on member join
    default: true
    files: ["src/template_bot/cogs/welcome.py"]

  - key: music
    label: Voice channel music playback (yt-dlp + ffmpeg required on the host)
    default: false
    files: ["src/template_bot/cogs/music.py"]
    patches:
      - file: pyproject.toml
        op: add
        path: /project/dependencies/-
        value: "yt-dlp>=2024.8.6"
      - file: pyproject.toml
        op: add
        path: /project/dependencies/-
        value: "PyNaCl>=1.5"

presets:
  - key: minimal
    label: Utility commands only, no moderation/welcome/music
    features: {moderation: false, welcome: false, music: false}
  - key: full
    label: Everything, including music
    features: {moderation: true, welcome: true, music: true}

verify:
  image: python:3.13-slim
  run: pip install -e .[dev] && pytest
