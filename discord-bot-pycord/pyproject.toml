[project]
name = "template-bot"
version = "0.1.0"
description = "TemplateBot - Discord bot (py-cord)"
requires-python = ">=3.13"  # tpl:var python_version 3.13
dependencies = [
    "py-cord>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
template-bot = "template_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
