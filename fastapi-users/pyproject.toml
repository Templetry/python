[project]
name = "template-app"
version = "0.1.0"
description = "TemplateApp - user management API"
requires-python = ">=3.12"  # tpl:var python_version 3.12
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic[email]>=2.9",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
