schema_version: 1
name: verifactu
description: "Spain only — Verifactu invoicing records (RD 1007/2023): SHA-256 hash chain, append-only registry, event log and QR payload"
variables:
  - key: issuer_nif
    label: NIF of the invoice issuer (the obligated taxpayer)
    default: ""
  - key: qr_base_url
    label: AEAT QR verification URL (see the AEAT technical document; leave empty until you have it)
    default: ""
